name = "bignum"
version = "0.1.0"
testDriver = "BignumTest"
defaultTargets = ["Bignum"]

[leanOptions]
#autoImplicit = false
relaxedAutoImplicit = false
# pp.unicode.fun = true # pretty-prints `fun a ↦ b`
# weak.linter.mathlibStandardSet = true
# maxSynthPendingDepth = 3
# experimental.module = true

[[require]]
name = "mathlib"
scope = "leanprover-community"

[[require]]
name = "cslib"
scope = "leanprover"

[[lean_lib]]
name = "Bignum"

[[lean_lib]]
name = "BignumTest"
globs = ["BignumTest.+"]

[[lean_exe]]
name = "sh"
root = "Shake"
